[package]
name = "probe-web"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
probe-ui = { path = "../runtime" }
wasm-bindgen = "0.2.130"
web-sys = { version = "0.3.107", features = [
    "CanvasRenderingContext2d",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "MouseEvent",
    "Performance",
    "Window",
] }

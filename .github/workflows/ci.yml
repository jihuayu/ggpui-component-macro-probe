name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        rust: [stable, '1.88.0']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          targets: wasm32-unknown-unknown
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.rust }}-
      - name: Run tests
        env:
          # The fixture harness invokes rustc directly and depends on the
          # host Cargo artifact naming. Compile-fail doctests still run here.
          PROBE_SKIP_EXTERNAL_DIAGNOSTICS: '1'
        run: cargo test --workspace --locked
      - name: Check WebAssembly example
        run: cargo check -p probe-web --target wasm32-unknown-unknown --locked
